name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build & Qt runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3
          python -m pip install --upgrade "nuitka[onefile]" patchelf PyQt6

      - name: Build single-file release
        run: bash packaging/build-release.sh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
