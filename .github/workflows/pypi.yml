name: pypi

# Publishes to PyPI on every v* tag using Trusted Publishing (no token needed).
# One-time: pypi.org → Your projects → hawkopsec → Publishing → add GitHub
# publisher (owner: emrekybs, repo: hawkopsec, workflow: pypi.yml, env: pypi).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build twine
      - run: python -m build && python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
